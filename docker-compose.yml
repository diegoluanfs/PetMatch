services:
  app:
    build:
      context: .
      dockerfile: docker/php-cli/Dockerfile
    container_name: petmatch-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_DSN: pgsql:host=database;port=5432;dbname=${DB_NAME:-petmatch}
      DB_USER: ${DB_USER:-petmatch}
      DB_PASSWORD: ${DB_PASSWORD:-petmatch}
      DB_NAME: ${DB_NAME:-petmatch}
      DB_HOST: database
      DB_PORT: 5432
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "sleep infinity"]

  php-fpm:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    container_name: petmatch-php-fpm
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_DSN: pgsql:host=database;port=5432;dbname=${DB_NAME:-petmatch}
      DB_USER: ${DB_USER:-petmatch}
      DB_PASSWORD: ${DB_PASSWORD:-petmatch}
      DB_NAME: ${DB_NAME:-petmatch}
      DB_HOST: database
      DB_PORT: 5432
    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: petmatch-web
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_started
    ports:
      - "8080:80"

  database:
    image: postgres:16-alpine
    container_name: petmatch-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-petmatch}
      POSTGRES_USER: ${DB_USER:-petmatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-petmatch}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - petmatch_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-petmatch} -d ${DB_NAME:-petmatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  petmatch_database_data: